<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}: SwiftParcel Agents</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2313233F'/%3E%3Crect x='7' y='9' width='18' height='14' rx='1.5' fill='%23F5C518'/%3E%3Cpath d='M7 14h18' stroke='%2313233F' stroke-width='2'/%3E%3C/svg%3E">
<style>
  /* Self-contained on purpose: this page must render even if every other file fails. */
  :root { --ink: #13233F; --paper: #E6EAEE; --label: #F5C518; --line: #C9D2DB; --muted: #5B6B7F; --stop: #B42318; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--paper); color: var(--ink); font: 16px/1.5 "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .label { width: min(560px, 100%); background: #fff; border: 2px solid var(--ink); border-radius: 6px; position: relative; overflow: hidden; }
  .band { background: var(--ink); color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; gap: 12px; font-weight: 700; }
  .band span:last-child { color: var(--label); font-variant-numeric: tabular-nums; }
  .body { padding: 28px 20px 24px; }
  h1 { margin: 0 0 10px; font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.15; letter-spacing: -0.01em; }
  p { margin: 0 0 12px; color: #2B3D5C; max-width: 52ch; }
  .route { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 18px 0 22px; padding-top: 14px; border-top: 2px dashed var(--line); font-size: .9rem; }
  .route dt { color: var(--muted); }
  .route dd { margin: 0; font-weight: 600; }
  .stamp { position: absolute; right: 18px; top: 64px; padding: 4px 12px; border: 3px solid var(--stop); color: var(--stop); border-radius: 6px;
           font-weight: 800; letter-spacing: .04em; text-transform: uppercase; transform: rotate(-8deg); opacity: .85; font-size: .95rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn { display: inline-block; padding: 10px 16px; border-radius: 6px; font-weight: 700; text-decoration: none; }
  a.primary { background: var(--ink); color: #fff; }
  a.secondary { border: 1px solid var(--line); color: var(--ink); }
  a:focus-visible { outline: 3px solid #1B66D1; outline-offset: 2px; }
  .barcode { height: 34px; margin: 0 20px 18px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 5px, var(--ink) 5px 6px, transparent 6px 9px); opacity: .8; }
  @media (max-width: 480px) { .stamp { position: static; display: inline-block; margin: 0 0 12px; } }
</style>
</head>
<body>
  <main class="label" role="main">
    <div class="band"><span>SwiftParcel support agents</span><span>{{code}}</span></div>
    <div class="body">
      <div class="stamp" aria-hidden="true">{{stamp}}</div>
      <h1>{{title}}</h1>
      <p>{{message}}</p>
      <dl class="route">
        <dt>Status</dt><dd>{{status_text}}</dd>
        <dt>Your data</dt><dd>Nothing was changed. Every visitor uses a private sandbox.</dd>
      </dl>
      <div class="actions">
        <a class="btn primary" href="/">{{action}}</a>
      </div>
    </div>
    <div class="barcode" aria-hidden="true"></div>
  </main>
</body>
</html>
